trigger:
  - main

pool:
  vmImage: windows-latest

parameters:
- name: devIndex
  displayName: 'Index de l environnement cible (seulement pour un déploiement sur env de DEV)'
  type: number
  default: 0
- name: disableSonar
  type: boolean
  default: false
  values:
    - true
    - false
- name: deployType
  displayName: "Technical parameter : don t modify it ! onlyDev/standard"
  type: string
  default: 'standard'
  values:
    - onlyDev
    - standard

resources:
  repositories:
  - repository: Pulse
    name: 'Pulse.Operations.Pipelines'
    type: git
    ref: 'refs/heads/Release/v3.1'

extends:
  template: pipelines/templates/platform.back.sql.yaml@Pulse
  parameters:
    devIndex: ${{ parameters.devIndex }}
    deployType: ${{ parameters.deployType }}
    disableSonar: ${{ parameters.disableSonar }}
    domain: pnl
    resource:
      id: '01'
      name: 'pnl'
      path: src\Pennylane.Sql.Database\Pennylane.Sql.Database.sqlproj
    dotnetcore: 10.x